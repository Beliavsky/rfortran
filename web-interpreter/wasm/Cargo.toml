[package]
name = "rfort-browser"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rfort-browser"
path = "../../src/browser_main.rs"

[dependencies]
anyhow = "1"
thiserror = "2.0.17"
logos = "0.15.1"
structopt = { version = "0.3", features = ["paw"] }
log = "0.4"
env_logger = "0.11"
codespan-reporting = "0.13"
target-lexicon = "0.13.2"
lazy_static = "1"
smallvec = "1"
lalrpop-util = { version = "0.22.2", default-features = false, features = ["lexer"] }
uuid = { version = "1.18.0", features = ["v4"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
fixed2free = { path = "../../tools/fixed2free" }

[build-dependencies]
lalrpop = "0.22.2"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true

[workspace]
