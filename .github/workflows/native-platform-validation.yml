name: Validate Linux and macOS native builds

# Validation does not publish binaries or claim platform support.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record platform
        run: |
          uname -a
          rustc -vV
      - name: Build compiler and interpreter
        run: cargo build --release --locked --bin rfort
      - name: Check standalone runtime with the native C linker
        run: python tests/test_native_runtime_link.py
      - name: Check interpreter, REPL and native -O0/-O2
        run: python tools/releases/smoke.py --binary target/release/rfort
      - name: Rust unit tests
        run: cargo test --locked --bin rfort
